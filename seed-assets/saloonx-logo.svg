<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- SaloonX — closed-scissors "X" monogram: cream + amber blades, ring handles -->
  <rect width="192" height="192" rx="46" fill="#5E1A2C"/>
  <!-- blades -->
  <line x1="62" y1="60" x2="134" y2="138" stroke="#F6EFE7" stroke-width="17" stroke-linecap="round"/>
  <line x1="130" y1="60" x2="62" y2="138" stroke="#E8A54B" stroke-width="17" stroke-linecap="round"/>
  <!-- finger rings -->
  <circle cx="60" cy="58" r="16" fill="none" stroke="#F6EFE7" stroke-width="10"/>
  <circle cx="132" cy="58" r="16" fill="none" stroke="#E8A54B" stroke-width="10"/>
</svg>
